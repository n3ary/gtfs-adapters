packages:
  - 'adapters/*'

# Dependabot alerts — all transitive, no upstream range yet
# admits a patched release. Each entry names the advisory it clears
# and the path the package enters the tree by. Drop an override once
# the package that pulls it in raises its own floor.
#   #1, #4 protobufjs   CVE-2026-59877 (DoS via infinite loop in
#                       .proto option parsing) - 7.6.4 -> 7.6.5
#   #2-7, #12, #18-21   brace-expansion DoS advisories (CVE-2026-13149
#                       exponential-time expansion, CVE-2026-14257
#                       unbounded expansion length, nested-group and
#                       parseCommaParts recursion) - both the 2.x and
#                       5.x lines, fixed by the per-major pins below
#   #5, #8 postcss      path-traversal in sourceMappingURL
#                       auto-loading (<= 8.5.22) - 8.5.16 -> 8.5.23+
#   #11 nanoid          custom generators loop forever when size is
#                       zero (< 3.3.18) - via postcss
#   #13 csv-parse       prototype replacement still reachable via the
#                       columns path (< 7.0.2) - via @n3ary/gtfs-spec
#   #14-16 vitest       path traversal / arbitrary file read via
#                       @vitest/mocker redirect mock (< 4.1.11), plus
#                       code injection via unauthenticated manual mock
#                       registration and the Windows backslash
#                       traversal bypass (both < 4.1.12)
#   #17, #24, #26, #29  markdown-it quadratic-time parsing DoS
#                       (< 14.3.3) - via jsdoc (protobufjs-cli) and
#                       markdown-it-anchor
#   #23 source-map-js   event-loop DoS via indexed source-map section
#                       offsets (< 1.2.2) - via postcss
#   #25, #27, #28 vite  launch-editor flag misinterpretation and the
#                       Windows fs.existsSync() bypass (<= 8.1.5) - via
#                       vitest
# vite is NOT listed here: it reaches the tree only as vitest's
# auto-installed peer, and pnpm's overrides do not apply to
# auto-installed peers. The adapter therefore declares vite directly
# so the peer resolves against a known-good version.
# zod (< 4.6.6, memory exhaustion on oversized constrained
# collections) and serialize-javascript (< 7.1.3, XSS via an unescaped
# </script in a serialized function body) are not flagged by
# Dependabot at all and were found with pnpm audit.
# brace-expansion needs the per-major selector form: this repo's
# lockfile pins two lines at once (2.x via CJS minimatch, 5.x via
# ESM minimatch), and 5.x is ESM-only. A flat `^5.0.12` would break
# the CJS consumer; selectors keep each line patched in place.
# See gtfs/pnpm-workspace.yaml for the single-line form
# used in the upstream consumer.
overrides:
  protobufjs: ^7.6.5
  postcss: ^8.5.23
  brace-expansion@<3: 2.1.7
  brace-expansion@>=3: 5.0.12
  markdown-it: ^14.3.3
  source-map-js: ^1.2.2
  csv-parse: ^7.0.2
  nanoid: ^3.3.18
  zod: ^4.6.6
  serialize-javascript: ^7.1.3

# pnpm 11 blocks postinstall scripts by default. The cluj adapter
# uses sharp (archiver zip writing) + esbuild (vitest/tsx binary
# download) + protobufjs (gtfs-realtime-bindings needs it). Pre-
# approve all of them here. Each adapter can override this in its
# own pnpm-workspace.yaml if it has a different dep profile.
allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true

# pnpm 11 supply-chain policy rejects packages published within
# the minimum release age cutoff (default 24h). Disable for this
# internal monorepo: every adapter depends on @n3ary/gtfs-spec
# (also internal, recently published), and we own the publish
# pipeline — no supply-chain attack surface from recent publishes.
# (Minutes; 0 = no cutoff.)
minimumReleaseAge: 0

# pnpm 11 has a SEPARATE tarball-hash check that runs even when
# minimumReleaseAge is 0: `pnpm install` re-fetches each internal
# dep's tarball and verifies its sha512 against what the registry
# serves now. After a fresh publish (CI re-builds the lockfile +
# GH Packages re-signs the tarball), the two can disagree for ~5
# minutes and produce `ERR_PNPM_TARBALL_URL_MISMATCH` in CI even
# though locally everything works.
#
# Trust policy set to `off` means "use the lockfile hashes
# as the source of truth, don't re-verify against the live registry"
# — same intent as `--trust-lockfile` on the CLI but persistent.
# The lockfile is part of the source tree and goes through PR
# review, so its hashes are already trusted.
#
# Note: the policy name was previously documented as `no-fallback`
# (legacy v10 syntax). pnpm 11 only accepts `off` or `no-downgrade`;
# any other value is silently ignored, so the re-verify step still
# runs in CI even though the config reads correctly. See pnpm 11
# source: `validateTrustPolicy` enum is `["off", "no-downgrade"]`.
trustPolicy: off
