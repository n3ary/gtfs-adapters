packages:
  - 'adapters/*'

# Dependabot alerts — all transitive, no upstream range yet
# admits a patched release. Closes alerts in the gtfs-adapters
# repo, including alerts #1-#8 across the top-level lockfile and
# the (now-removed) inner adapters/cluj-napoca/pnpm-lock.yaml:
#   #1 protobufjs     CVE-2026-59877 (DoS via infinite loop in
#                    .proto option parsing) - 7.6.4 -> 7.6.5
#   #2 brace-expansion CVE-2026-14257 (DoS via unbounded expansion
#                    length) - both 2.1.1 and 5.0.7 -> patched
#   #3-7 brace-expansion CVE-2026-13149 / CVE-2026-14257 — same
#                    lines (2.1.1 + 5.0.7) tracked under separate
#                    CVE buckets, both fixed by the per-major pins
#                    below
#   #4 protobufjs     CVE-2026-59877 — second bucket, same fix
#   #5, #8 postcss    path-traversal in sourceMappingURL
#                    auto-loading (<= 8.5.17) - 8.5.16 -> 8.5.18+
# brace-expansion needs the per-major selector form: this repo's
# lockfile pins two lines at once (2.x via CJS minimatch, 5.x via
# ESM minimatch), and 5.x is ESM-only. A flat `^5.0.8` would break
# the CJS consumer; selectors keep each line patched in place.
# Drop these once ajv/tailwindcss (protobufjs via vite-plugin-pwa)
# and the minimatch/glob path (brace-expansion) raise their own
# ranges. See gtfs/pnpm-workspace.yaml for the single-line form
# used in the upstream consumer.
overrides:
  protobufjs: ^7.6.5
  postcss: ^8.5.18
  brace-expansion@<3: 2.1.3
  brace-expansion@>=3: 5.0.8

# pnpm 11 blocks postinstall scripts by default. The cluj adapter
# uses sharp (archiver zip writing) + esbuild (vitest/tsx binary
# download) + protobufjs (gtfs-realtime-bindings needs it). Pre-
# approve all of them here. Each adapter can override this in its
# own pnpm-workspace.yaml if it has a different dep profile.
allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true

# pnpm 11 supply-chain policy rejects packages published within
# the minimum release age cutoff (default 24h). Disable for this
# internal monorepo: every adapter depends on @n3ary/gtfs-spec
# (also internal, recently published), and we own the publish
# pipeline — no supply-chain attack surface from recent publishes.
# (Minutes; 0 = no cutoff.)
minimumReleaseAge: 0

# pnpm 11 has a SEPARATE tarball-hash check that runs even when
# minimumReleaseAge is 0: `pnpm install` re-fetches each internal
# dep's tarball and verifies its sha512 against what the registry
# serves now. After a fresh publish (CI re-builds the lockfile +
# GH Packages re-signs the tarball), the two can disagree for ~5
# minutes and produce `ERR_PNPM_TARBALL_URL_MISMATCH` in CI even
# though locally everything works.
#
# Trust policy set to `off` means "use the lockfile hashes
# as the source of truth, don't re-verify against the live registry"
# — same intent as `--trust-lockfile` on the CLI but persistent.
# The lockfile is part of the source tree and goes through PR
# review, so its hashes are already trusted.
#
# Note: the policy name was previously documented as `no-fallback`
# (legacy v10 syntax). pnpm 11 only accepts `off` or `no-downgrade`;
# any other value is silently ignored, so the re-verify step still
# runs in CI even though the config reads correctly. See pnpm 11
# source: `validateTrustPolicy` enum is `["off", "no-downgrade"]`.
trustPolicy: off
